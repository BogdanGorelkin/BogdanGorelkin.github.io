# Builds the Vite app and publishes dist/ to GitHub Pages
# (https://bogdangorelkin.github.io/ — a user site, so it's served from `/`).
#
# One-time repository setting: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". With "Deploy from a branch", GitHub serves the raw
# repository instead (index.html → /src/main.tsx), which can't load.
name: Deploy to GitHub Pages

on:
  push:
    branches: [cv-journey]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json → packageManager.
      - uses: pnpm/action-setup@v4

      # Node from .nvmrc (22; Vite 8 / rolldown needs >= 22.12).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -b && vite build; the Vite plugin ships only public/videos/optimized/.
      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
